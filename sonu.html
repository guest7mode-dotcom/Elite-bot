<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyFan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111, #222);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .rainbow-title {
      font-size: 3rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      text-align: center;
    }

    .card img {
      width: 280px;
      max-width: 90vw;
      border-radius: 12px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .name {
      margin-top: 15px;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <h1 class="rainbow-title">OnlyFan</h1>

  <div class="card">
    <img src="alien.jpeg" alt="Prank image">
    <div class="name">Femboi Alien</div>
  </div>
</body>
</html>
