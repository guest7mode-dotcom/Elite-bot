<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OnlyFan Prank</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Rainbow moving title */
    .rainbow-title {
      font-size: 48px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: linear-gradient(
        90deg,
        red, orange, yellow, green, blue, indigo, violet, red
      );
      background-size: 400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow-move 3s linear infinite;
      margin-bottom: 30px;
    }

    @keyframes rainbow-move {
      0%   { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }

    /* Big image frame */
    .image-frame {
      width: 600px;
      max-width: 90vw;
      aspect-ratio: 1 / 1;
      border: 6px solid #ff0055;
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(255, 0, 85, 0.9);
      overflow: hidden;
      background: #110011;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Name under the image */
    .name {
      margin-top: 20px;
      font-size: 32px;
      font-weight: bold;
      color: #ff8a80;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1 class="rainbow-title">OnlyFan</h1>

  <div class="image-frame">
    <!-- If image is in the same folder as this HTML file -->
    <img src="sujash.jpg" alt="Prank image">
  </div>

  <div class="name">SUJASH</div>
</body>
</html>
