<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlyFan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #00aff0, #018cf1, #5fd2ff);
      overflow: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      filter: blur(10px);
    }

    body::before {
      width: 300px;
      height: 300px;
      top: -80px;
      left: -80px;
    }

    body::after {
      width: 260px;
      height: 260px;
      bottom: -70px;
      right: -70px;
    }

    .container {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      padding: 30px 25px;
      width: 320px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .rainbow-title {
      font-size: 2.6rem;
      font-weight: 800;
      color: white;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
    }

    .image-box img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 16px;
      border: 4px solid white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .name {
      margin-top: 16px;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 480px) {
      .container {
        padding: 22px 18px;
      }

      .rainbow-title {
        font-size: 2.1rem;
      }

      .name {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="rainbow-title">OnlyFan</h1>

    <div class="image-box">
      <img src="alien.jpeg" alt="Prank image">
    </div>

    <div class="name">Femboi Alien-Chan <3</div>
  </div>
</body>
</html>
