<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Suspicious 24</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050510;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 15, 25, 0.95);
      border-radius: 16px;
      padding: 20px 18px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; text-align: center; }
    h2 { font-size: 1.1rem; margin: 14px 0 8px; }
    p  { font-size: 0.9rem; opacity: 0.85; margin: 4px 0 10px; }
    .hidden { display: none; }
    .batch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .batch-btn {
      padding: 10px 0;
      background: #181828;
      border-radius: 8px;
      border: 1px solid #30304a;
      text-align: center;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .batch-btn.selected {
      background: #e33467;
      border-color: #ff7aa2;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      background: #e33467;
      color: white;
    }
    button.secondary { background: #28283d; }
    .menu-btn { margin-top: 8px; }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      opacity: 0.7;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div id="playerView" class="card">
    <h1>Suspicious 24</h1>
    <h2>Select your batch</h2>
    <p>Choose your class (1–6). All stats are shared per batch.</p>
    <div id="batchGrid" class="batch-grid"></div>
    <p class="label">Mode</p>
    <button id="join6Btn">Join Ranked 6‑Player</button>
    <button id="join12Btn">Join Ranked 12‑Player</button>
    <button class="secondary" id="joinPlayBtn">Join Play Lobby</button>
    <p id="playerInfo"></p>
  </div>

  <script>
    let currentBatch = null;
    const batchGrid = document.getElementById("batchGrid");
    const playerInfo = document.getElementById("playerInfo");
    const join6Btn = document.getElementById("join6Btn");
    const join12Btn = document.getElementById("join12Btn");
    const joinPlayBtn = document.getElementById("joinPlayBtn");

    // Create batch buttons 1-6
    for (let i = 1; i <= 6; i++) {
      const btn = document.createElement("button");
      btn.textContent = "Batch " + i;
      btn.className = "batch-btn";
      btn.dataset.value = i;
      btn.onclick = () => {
        document.querySelectorAll(".batch-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        currentBatch = i;
        playerInfo.textContent = "You selected Batch " + i + ".";
      };
      batchGrid.appendChild(btn);
    }

    function requireBatch() {
      if (!currentBatch) {
        alert("Select your batch first.");
        return false;
      }
      return true;
    }

    join6Btn.onclick = () => {
      if (!requireBatch()) return;
      alert("Ranked 6‑Player placeholder. Batch " + currentBatch);
    };
    join12Btn.onclick = () => {
      if (!requireBatch()) return;
      alert("Ranked 12‑Player placeholder. Batch " + currentBatch);
    };
    joinPlayBtn.onclick = () => {
      if (!requireBatch()) return;
      alert("Play Lobby placeholder. Batch " + currentBatch);
    };
  </script>
</body>
</html>
