<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Headmaster – Suspicious 24</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #050510;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 15, 25, 0.95);
      border-radius: 16px;
      padding: 20px 18px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
    }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      background: #e33467;
      color: #fff;
    }
    button.secondary { background: #28283d; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Headmaster Panel</h1>
    <p style="font-size:0.9rem; opacity:0.85;">
      Suspicious 24 control room. (Placeholder UI for now.)
    </p>

    <button>Create Ranked 6‑Player Lobby</button>
    <button>Create Ranked 12‑Player Lobby</button>
    <button class="secondary">Create Play Lobby</button>
    <button class="secondary">Back to Help</button>
  </div>
</body>
</html>
